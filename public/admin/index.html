<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم — Meat &amp; Cheezz</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/admin/admin.css?v=61748e611a">
<script type="module" src="/admin/admin.js?v=f4934dd8da"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="currentColor"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="2" fill="currentColor"/><path d="M4 18l5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path d="M12 2.2a9.7 9.7 0 0 0-8.4 14.6L2.3 21.7l5-1.3A9.7 9.7 0 1 0 12 2.2zm4.4 11.7c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.5-.3z" fill="currentColor"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<!-- Login -->
<section class="login" id="login" hidden>
  <form class="login__card" id="loginForm">
    <div class="brand"><b>MEAT</b><small>AND</small><b>CHEEZZ</b></div>
    <h1 data-t="loginTitle">لوحة التحكم</h1>
    <p class="muted" data-t="loginSub">ادخل كلمة السر لتعدّل المنيو والأسعار والفروع.</p>
    <label class="fld"><span data-t="password">كلمة السر</span>
      <span class="pw"><input id="pw" type="password" autocomplete="current-password" required><button type="button" id="pwEye" class="iconbtn" aria-label="Show"><svg class="ic"><use href="#i-eye"/></svg></button></span>
    </label>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn btn--y btn--block" type="submit" data-t="signIn">دخول</button>
    <button class="linkbtn" type="button" data-lang data-t="langSwitch">English</button>
  </form>
</section>

<!-- App -->
<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand brand--sm"><b>MEAT</b><small>AND</small><b>CHEEZZ</b></div>
    <span class="top__title" data-t="dashboard">لوحة التحكم</span>
    <div class="top__actions">
      <a class="btn btn--ghost btn--sm" href="/" target="_blank" rel="noopener"><svg class="ic"><use href="#i-eye"/></svg><span data-t="viewSite">شوف الموقع</span></a>
      <button class="btn btn--ghost btn--sm" type="button" data-lang data-t="langSwitch">English</button>
      <button class="iconbtn" type="button" id="logout" aria-label="Logout"><svg class="ic"><use href="#i-out"/></svg></button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-view="overview" aria-selected="true" data-t="tabOverview">الرئيسية</button>
    <button role="tab" data-view="menu" aria-selected="false" data-t="tabMenu">المنيو</button>
    <button role="tab" data-view="branches" aria-selected="false" data-t="tabBranches">الفروع</button>
    <button role="tab" data-view="settings" aria-selected="false" data-t="tabSettings">الإعدادات</button>
  </nav>
  <main class="wrap">
    <section class="view" id="view-overview"></section>
    <section class="view" id="view-menu" hidden></section>
    <section class="view" id="view-branches" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
</div>

<!-- Item editor -->
<dialog class="panel" id="editor" aria-labelledby="edTitle">
  <form class="panel__in" id="edForm" novalidate>
    <header class="panel__head"><h2 id="edTitle"></h2><button class="iconbtn" type="button" data-close aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button></header>
    <div class="panel__body" id="edBody"></div>
    <footer class="panel__foot">
      <button class="btn btn--danger" type="button" id="edDelete"><svg class="ic"><use href="#i-trash"/></svg><span data-t="delete">حذف</span></button>
      <span class="grow"></span>
      <button class="btn btn--ghost" type="button" data-close data-t="cancel">إلغاء</button>
      <button class="btn btn--y" type="submit" id="edSave" data-t="save">حفظ</button>
    </footer>
  </form>
</dialog>

<!-- Categories -->
<dialog class="panel" id="catsDlg" aria-labelledby="catsTitle">
  <div class="panel__in">
    <header class="panel__head"><h2 id="catsTitle" data-t="categories">الأقسام</h2><button class="iconbtn" type="button" data-close aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button></header>
    <div class="panel__body" id="catsBody"></div>
  </div>
</dialog>

<!-- Order details -->
<dialog class="panel panel--sm" id="orderDlg" aria-labelledby="odTitle">
  <div class="panel__in">
    <header class="panel__head"><h2 id="odTitle"></h2><button class="iconbtn" type="button" data-close aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button></header>
    <div class="panel__body" id="odBody"></div>
  </div>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
